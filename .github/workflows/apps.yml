name: Apps

on:
  push:
    branches: [main, "1.0.0"]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-app:
    name: build apps/test and apps/docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @nmmty/lazycanvas-test build
      # The API reference is generated from the packages' source and is not
      # committed, so generate it before building the site.
      - run: pnpm --filter @nmmty/lazycanvas docgen
      - run: pnpm --filter @nmmty/lazycanvas-docs build
