name: Release

# Publishes the packages whose version is not on npm yet when a version tag is
# pushed. Packages are versioned independently: bump the ones that changed,
# and the others are skipped.
#
#   git tag v1.0.1 && git push origin v1.0.1   # v<version of a package being published>
#
# Prerelease versions (1.0.0-rc.1) are published under the `next` dist-tag,
# stable ones under `latest`. Needs an NPM_TOKEN secret with publish rights to
# the @nmmty scope.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only release commits that are on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Work out what to publish
        id: release
        run: |
          plan="$(node scripts/check-release.mjs "$GITHUB_REF_NAME")"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "### Publishing" >> "$GITHUB_STEP_SUMMARY"
          echo "$plan" | jq -r '.[] | "- `\(.name)@\(.version)` (\(.distTag))"' >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:packages

      - name: Publish
        run: |
          echo '${{ steps.release.outputs.plan }}' | jq -r '.[] | [.name, .distTag] | @tsv' |
          while IFS=$'\t' read -r name dist_tag; do
            echo "::group::Publishing $name ($dist_tag)"
            pnpm --filter "$name" publish --access public --tag "$dist_tag" --no-git-checks
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: GitHub release
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}
