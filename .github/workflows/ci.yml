name: CI

on:
  push:
    branches: [main, "1.0.0"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build first: the adapters typecheck against the core package's emitted
      # declarations, which do not exist on a fresh checkout.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Diagnose (temporary)
        continue-on-error: true
        working-directory: packages/adapter-node
        run: |
          fc-list : family | sort -u | head -20
          node -e "
          const {GlobalFonts,createCanvas}=require('@napi-rs/canvas');
          const {Fonts}=require('../lazycanvas/dist/fonts/index.js');
          const ink=(fam,dir)=>{const c=createCanvas(200,100),x=c.getContext('2d');x.fillStyle='#fff';x.font='700 30px '+fam;if(dir)x.direction=dir;x.fillText('Hello',10,50);const d=x.getImageData(0,0,200,100).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>0)n++;return n};
          console.log('families before', GlobalFonts.families.length, JSON.stringify(GlobalFonts.families.slice(0,8)));
          console.log('sans-serif ink', ink('sans-serif'), 'DejaVu Sans ink', ink('DejaVu Sans'));
          for (const [fam,w] of Object.entries(Fonts)) for (const [wt,b64] of Object.entries(w)) console.log('register',fam,wt,!!GlobalFonts.register(Buffer.from(b64,'base64'),fam));
          console.log('Geist ink', ink('Geist'), 'Geist has', GlobalFonts.has('Geist'));
          "

      - name: Test
        run: pnpm test

      # Packs the four public packages, installs the tarballs into a clean
      # project and loads every entry point as both ESM and CJS.
      - name: Check the published packages
        run: pnpm check:packages
