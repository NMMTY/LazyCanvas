name: CI

on:
  push:
    branches: [main, "1.0.0"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build first: the adapters typecheck against the core package's emitted
      # declarations, which do not exist on a fresh checkout.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Diagnose (temporary)
        continue-on-error: true
        working-directory: packages/adapter-node
        run: |
          fc-list : family | sort -u | head -12
          node -e "
          const lc=require('../lazycanvas/dist/index.js');
          const {Fonts}=require('../lazycanvas/dist/fonts/index.js');
          const {NodeCanvasAdapter}=require('./dist/index.js');
          (async()=>{
            for (const direction of ['ltr','ttb']) {
              const scene=new lc.Scene(400,300,{adapter:new NodeCanvasAdapter()});
              scene.lazyCanvas.manager.fonts.loadFonts(Fonts);
              const t=new lc.Text({text:'one two three',color:'#ffffff',font:{family:'Geist',size:20,weight:400},position:{x:10,y:10},align:'left',baseline:'top',centring:lc.Centring.None,direction,vertical:{mode:'words'}});
              scene.load(new lc.Group().add(t));
              const ctx=scene.lazyCanvas.ctx; ctx.font='400 20px Geist';
              const m=ctx.measureText('one');
              console.log(direction,'measure',JSON.stringify({w:m.width,asc:m.fontBoundingBoxAscent,desc:m.fontBoundingBoxDescent,aa:m.actualBoundingBoxAscent}));
              if (direction==='ttb') console.log('units',JSON.stringify(t.layoutVertical(ctx,scene.lazyCanvas.canvas)).slice(0,600));
              await scene.renderFrame(0);
              const d=scene.getImageData(); let n=0; for(let i=3;i<d.length;i+=4) if(d[i]>40) n++;
              console.log(direction,'ink',n, 'props.position', JSON.stringify(t.props.position));
            }
          })().catch(e=>console.log('ERR',e));
          "

      - name: Test
        run: pnpm test

      # Packs the four public packages, installs the tarballs into a clean
      # project and loads every entry point as both ESM and CJS.
      - name: Check the published packages
        run: pnpm check:packages
